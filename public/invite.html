<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приглашение</title><link rel="stylesheet" href="/styles.css"></head><body class="invite flow"><main id="invite" class="date-phone"><div class="speaker"></div><section class="step active" id="step-ask"><div class="mascot">🧸</div><p class="overline">ПРИГЛАШЕНИЕ</p><p id="for" class="hello"></p><h1 id="question">Пойдёшь со мной на свидание?</h1><button class="pink-button" data-answer="yes">Да, конечно</button><button class="no" data-answer="no">Нет</button></section><section class="step" id="step-yes"><div class="mascot">💞</div><h1>Я знал, что ты согласишься!</h1><p>Теперь давай выберем детали</p><button class="pink-button" id="to-ideas">Давай</button></section><section class="step" id="step-ideas"><div class="mascot small">💕</div><h1>Что будем<br>делать?</h1><p>Выбери то, что хочется больше всего</p><div id="ideas" class="idea-grid"></div><button class="pink-button" id="to-date" disabled>Продолжить</button></section><section class="step" id="step-date"><div class="mascot">🐶</div><h1>Когда тебе<br>будет удобно?</h1><form id="details"><label>Дата<input id="date" type="date" required></label><label>Время<input id="time" type="time" required></label><button class="pink-button" type="submit">Выбрать дату ♡</button></form></section><section class="step" id="step-ticket"><div class="ticket-heart">💌</div><p id="ticket-lead"></p><h1>Договорились!</h1><p id="ticket-text"></p><div class="ticket"><div>📅 <b id="ticket-date"></b></div><div>🕒 <b id="ticket-time"></b></div><div>✨ <b id="ticket-idea"></b></div><small>Скриншоть и сохраняй 📸</small></div></section></main><script src="/app.js"></script></body></html>
