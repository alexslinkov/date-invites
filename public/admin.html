<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создать приглашение</title><link rel="stylesheet" href="/styles.css"></head><body><main class="admin"><a class="back" href="/">← На главную</a><span class="eyebrow">ТВОЯ МАСТЕРСКАЯ</span><h1>Новое приглашение</h1><form id="invite-form"><label>Твой пароль<span class="password-field"><input required id="password" name="password" type="password"><button id="toggle-password" type="button">◉</button></span></label><label>Имя девушки<input required id="recipient" name="recipient" placeholder="Например, Аня"></label><label>Вопрос<input id="question" name="question" value="Пойдёшь со мной на свидание?"></label><p class="label">Варианты встречи</p><div id="events"><div class="event-row"><input class="event-emoji" value="☕" aria-label="Эмодзи"><input class="event-title" value="Уютный кофе" aria-label="Мероприятие"></div><div class="event-row"><input class="event-emoji" value="🌃" aria-label="Эмодзи"><input class="event-title" value="Прогулка" aria-label="Мероприятие"></div><div class="event-row"><input class="event-emoji" value="🍽️" aria-label="Эмодзи"><input class="event-title" value="Ужин" aria-label="Мероприятие"></div></div><button type="button" class="add-event" id="add-event">+ Добавить вариант</button><button class="button" type="submit">Создать ссылку <span>→</span></button></form><section id="result" hidden></section><section class="list"><h2>Отправленные</h2><div id="invites">Введите пароль и создайте первое приглашение.</div></section></main><script src="/app.js"></script></body></html>
